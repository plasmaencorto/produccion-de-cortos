# Configuración para publicar la app en Render como sitio web
services:
  - type: web
    name: produccion-de-cortos
    runtime: static
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./dist-web
    # Todas las rutas las maneja la app en el navegador
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
