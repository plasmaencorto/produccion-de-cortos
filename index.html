<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <title>Producción de Cortos 🎬</title>
    <meta
      name="description"
      content="Herramienta gratuita para producir cortometrajes: desglosa tu guion, arma el presupuesto, planea el rodaje y genera hojas de llamado."
    />

    <!-- Ícono (pestaña del navegador y pantalla de inicio del celular) -->
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Vista previa al compartir el link por WhatsApp o redes -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Producción de Cortos 🎬" />
    <meta
      property="og:description"
      content="Desglosa tu guion, arma el presupuesto, planea el rodaje y genera hojas de llamado. Gratis y desde el navegador."
    />
    <meta property="og:url" content="https://cortos.plasmaencorto.com/" />
    <!-- La imagen de vista previa necesita URL completa: WhatsApp y redes
         no resuelven rutas relativas. Solo aplica al sitio en linea. -->
    <meta property="og:image" content="https://cortos.plasmaencorto.com/icono-compartir.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
